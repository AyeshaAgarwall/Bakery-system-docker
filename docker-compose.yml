version: '3.8'

services:
  # Database Service
  db:
    image: postgres:13
    container_name: bakery_db
    environment:
      POSTGRES_USER: bakery_user
      POSTGRES_PASSWORD: bakery_password
      POSTGRES_DB: bakery_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - bakery_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakery_user -d bakery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache Service
  redis:
    image: redis:6
    container_name: bakery_redis
    ports:
      - "6379:6379"
    networks:
      - bakery_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Message Queue Service
  rabbitmq:
    image: rabbitmq:3-management
    container_name: bakery_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"  # AMQP protocol port
      - "15672:15672"  # Management UI port
    networks:
      - bakery_network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build: ./backend
    container_name: bakery_backend
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bakery_network
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=bakery_user
      - DB_PASSWORD=bakery_password
      - DB_NAME=bakery_db
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Frontend Web Service (HTML/CSS version)
  frontend:
    build: ./frontend
    container_name: bakery_frontend
    ports:
      - "8080:80"  # Mapping host port 8080 to container port 80 (nginx)
    depends_on:
      - backend
    networks:
      - bakery_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - API_URL=http://backend:3000
  # Order Processing Worker Service
  worker:
    build: ./worker
    container_name: bakery_worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bakery_network
    environment:
      - DB_HOST=db
      - DB_USER=bakery_user
      - DB_PASSWORD=bakery_password
      - DB_NAME=bakery_db
      - RABBITMQ_HOST=rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep node"]
      interval: 30s
      timeout: 10s
      retries: 3

# Volumes and Networks
volumes:
  postgres_data:

networks:
  bakery_network:
    driver: bridge